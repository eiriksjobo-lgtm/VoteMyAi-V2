<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoteMyAI Radio 📻</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --accent: #ff3d5a;
  --accent2: #ff6b3d;
  --accent-glow: rgba(255, 61, 90, 0.3);
  --text: #e8e6f0;
  --text-dim: #7a7890;
  --text-bright: #ffffff;
  --border: #2a2a3a;
  --green: #3dff8f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* === PASSWORD GATE === */
#passwordGate {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
}
#passwordGate h1 {
  font-size: 2rem; font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#passwordGate input {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 14px 20px; border-radius: 12px;
  font-size: 1rem; width: 280px; text-align: center;
  font-family: 'Space Mono', monospace;
  outline: none; transition: border-color 0.2s;
}
#passwordGate input:focus { border-color: var(--accent); }
#passwordGate button {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white; border: none; padding: 14px 40px; border-radius: 12px;
  font-size: 1rem; font-weight: 600; cursor: pointer;
  font-family: 'Outfit', sans-serif;
  transition: transform 0.15s, box-shadow 0.15s;
}
#passwordGate button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px var(--accent-glow);
}
#passwordGate .error {
  color: var(--accent); font-size: 0.85rem;
  opacity: 0; transition: opacity 0.3s;
}
#passwordGate .error.show { opacity: 1; }

/* === MAIN RADIO UI === */
#radioApp { display: none; }

.radio-bg {
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,61,90,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 100%, rgba(255,107,61,0.05) 0%, transparent 50%),
              var(--bg);
}

.container {
  max-width: 600px; margin: 0 auto; padding: 20px;
  min-height: 100vh; display: flex; flex-direction: column;
  overflow-anchor: none;
}

/* Header */
.header {
  text-align: center; padding: 40px 0 30px;
}
.header .badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  padding: 6px 14px; border-radius: 100px;
  font-size: 0.75rem; color: var(--text-dim);
  font-family: 'Space Mono', monospace;
  margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px;
}
.header .badge .live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  animation: pulse 1.5s ease infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(61,255,143,0.4); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(61,255,143,0); }
}
.header h1 {
  font-size: 2.2rem; font-weight: 900; letter-spacing: -1px;
  background: linear-gradient(135deg, var(--text-bright), var(--text));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header h1 span {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

/* Now Playing Card */
.now-playing {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 28px;
  margin-bottom: 20px;
  position: relative; overflow: hidden;
}
.now-playing::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  background-size: 200% 100%;
  animation: shimmer 3s ease infinite;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.np-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem; color: var(--accent);
  text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 14px;
}
.np-title {
  font-size: 1.5rem; font-weight: 800; color: var(--text-bright);
  margin-bottom: 6px; line-height: 1.2;
}
.np-meta {
  font-size: 0.9rem; color: var(--text-dim); margin-bottom: 16px;
}
.np-meta .platform {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  background: var(--surface2); font-size: 0.75rem;
  font-family: 'Space Mono', monospace;
  border: 1px solid var(--border);
}
.np-stats {
  display: flex; gap: 16px; margin-bottom: 18px;
}
.np-stat {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.85rem; color: var(--text-dim);
}
.np-stat .val { color: var(--text-bright); font-weight: 600; }

/* Progress bar */
.progress-wrap {
  width: 100%; height: 4px; background: var(--surface2);
  border-radius: 10px; overflow: hidden; margin-bottom: 8px;
}
.progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 10px; transition: width 0.5s linear;
}
.progress-time {
  display: flex; justify-content: space-between;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem; color: var(--text-dim);
}

/* Artist Note */
.artist-note {
  background: var(--surface2); border-left: 3px solid var(--accent2);
  padding: 0 16px; border-radius: 0 12px 12px 0;
  margin-top: 0; max-height: 0; overflow: hidden; opacity: 0;
  transition: all 0.4s ease;
}
.artist-note.visible {
  padding: 14px 16px; margin-top: 16px;
  max-height: 200px; opacity: 1;
}
.artist-note .label {
  font-size: 0.7rem; color: var(--accent2);
  text-transform: uppercase; letter-spacing: 1px;
  font-family: 'Space Mono', monospace;
  margin-bottom: 6px;
}
.artist-note .text {
  font-size: 0.9rem; color: var(--text); font-style: italic;
  line-height: 1.5;
}

/* Host Message */
.host-msg {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 24px;
  margin-bottom: 20px;
  opacity: 0;
  max-height: 0; overflow: hidden;
  transition: opacity 0.4s ease, max-height 0.4s ease, padding 0.4s ease, margin 0.4s ease;
  padding: 0 24px; margin-bottom: 0;
}
.host-msg.visible {
  opacity: 1;
  max-height: 300px;
  padding: 24px;
  margin-bottom: 20px;
}
.host-msg .host-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.host-msg .host-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
}
.host-msg .host-name {
  font-weight: 700; font-size: 0.95rem; color: var(--text-bright);
}
.host-msg .host-role {
  font-size: 0.7rem; color: var(--text-dim);
  font-family: 'Space Mono', monospace;
}
.host-msg .host-text {
  font-size: 0.95rem; color: var(--text); line-height: 1.6;
}

/* Controls */
.controls {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; padding: 20px 0;
}
.btn-play {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px var(--accent-glow);
}
.btn-play:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 40px var(--accent-glow);
}
.btn-play svg { fill: white; }
.btn-skip {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.btn-skip:hover { background: var(--surface); }
.btn-skip svg { fill: var(--text-dim); width: 18px; }

.volume-wrap {
  display: flex; align-items: center; gap: 8px;
}
.volume-wrap svg { fill: var(--text-dim); width: 18px; }
.volume-wrap input[type="range"] {
  width: 80px; accent-color: var(--accent);
}

/* Listeners */
.listeners {
  text-align: center; padding: 10px 0;
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem; color: var(--text-dim);
}

/* Up Next */
.up-next {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 20px 24px; margin-bottom: 20px;
}
.up-next h3 {
  font-size: 0.7rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 2px;
  font-family: 'Space Mono', monospace;
  margin-bottom: 14px;
}
.up-next-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.up-next-item:last-child { border-bottom: none; }
.up-next-num {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem; color: var(--text-dim);
  width: 20px; text-align: center;
}
.up-next-info { flex: 1; }
.up-next-title { font-weight: 600; font-size: 0.9rem; color: var(--text-bright); }
.up-next-genre { font-size: 0.75rem; color: var(--text-dim); }
.up-next-rating {
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem; color: var(--accent2);
}

/* Hidden players */
#hiddenPlayers {
  position: fixed; top: -9999px; left: -9999px;
  width: 1px; height: 1px; overflow: hidden;
}

/* Start overlay */
#startOverlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(10,10,15,0.95);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  backdrop-filter: blur(20px);
}
#startOverlay h2 {
  font-size: 1.8rem; font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#startOverlay p { color: var(--text-dim); font-size: 0.95rem; }
#startOverlay .start-btn {
  width: 100px; height: 100px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 60px var(--accent-glow);
  transition: transform 0.2s, box-shadow 0.2s;
  animation: breathe 2s ease infinite;
}
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 40px var(--accent-glow); }
  50% { box-shadow: 0 0 80px var(--accent-glow); }
}
#startOverlay .start-btn:hover {
  transform: scale(1.1);
}
#startOverlay .start-btn svg { fill: white; width: 40px; height: 40px; }

/* Responsive */
@media (max-width: 480px) {
  .header h1 { font-size: 1.6rem; }
  .np-title { font-size: 1.2rem; }
  .container { padding: 12px; }
}
</style>
</head>

<!-- Hidden players -->

// Fetch tracks from Supabase and normalize for radio
async function fetchSchedule() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/tracks?select=*&order=avg_rating.desc&limit=500`,
    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
  );
  const tracks = await res.json();

  // Shuffle with weighted randomness (higher rated = more likely to be early)
  const shuffled = tracks
    .map(t => ({ ...t, sort: Math.random() * (t.avg_rating || 1) }))
    .sort((a, b) => b.sort - a.sort);

  const mapped = shuffled.map(t => {
    // Extract platform-specific IDs from embed_url
    const platform = (t.tool || '').toLowerCase();
    let suno_id = null;
    let youtube_id = t.yt_id || null;
    let soundcloud_url = null;
    let audio_url = null;

    // Detect platform from ACTUAL URL content, not the tool field
    // This handles cases where tool="Suno" but embed_url is actually YouTube
    if (t.embed_url) {
      const url = t.embed_url;

      if (url.match(/suno\.com\/song\/([a-f0-9-]+)/i)) {
        // Suno song URL
        const match = url.match(/suno\.com\/song\/([a-f0-9-]+)/i);
        suno_id = match[1];
        audio_url = `https://cdn1.suno.ai/${suno_id}.mp3`;
      } else if (url.match(/youtu\.?be/)) {
        // YouTube URL (youtu.be or youtube.com)
        const match = url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/)([a-zA-Z0-9_-]+)/);
        if (match) youtube_id = match[1];
      } else if (url.includes('soundcloud.com')) {
        // SoundCloud URL
        soundcloud_url = url;
      } else if (url.match(/udio\.com/)) {
        // Udio — skip for now
      }
    }

    // Also check yt_id field as fallback
    if (!youtube_id && t.yt_id) {
      youtube_id = t.yt_id;
    }

    // Determine actual platform from what we found
    let actualPlatform = platform;
    if (audio_url && suno_id) actualPlatform = 'suno';
    else if (youtube_id) actualPlatform = 'youtube';
    else if (soundcloud_url) actualPlatform = 'soundcloud';

    return {
      id: t.id,
      title: t.title || 'Untitled',
      genre: t.genre || 'Unknown',
      platform: actualPlatform,
      artist_note: t.artist_note || null,
      avg_rating: t.avg_rating || 0,
      num_ratings: t.rating_count || 0,
      votes: t.votes || 0,
      thumbnail_url: t.thumbnail_url || null,
      embed_url: t.embed_url || null,
      audio_url: audio_url,
      suno_id: suno_id,
      youtube_id: youtube_id,
      soundcloud_url: soundcloud_url,
    };
  }).filter(t => {
    // Only include tracks with direct audio (Suno CDN mp3)
    return !!t.audio_url;
  });

  // Store all tracks for re-shuffling on loop
  allTracks = [...mapped];

  // Initial genre-diverse shuffle with top-100 boost
  const reordered = genreDiverseShuffle(mapped);
  console.log(`📻 Genre-diverse schedule: ${reordered.length} tracks (top 100 boosted 3x)`);
  return reordered;
}

// --- Host personality lines ---

    `Somebody submitted "${track.title}" to VoteMyAI. ${genre}. No clout bias here — just pure, blind, questionable judgment. ${ratingRoast}${noteRoast}`,
    `Welcome back. Did you miss me? No? Too bad. Here's "${track.title}", ${genre}. ${ratingRoast}${noteRoast} You're welcome.`,
    `Fun fact: this next song, "${track.title}", was made by artificial intelligence. And honestly? You can tell. ${genre}. ${ratingRoast}${noteRoast} Just kidding. Maybe.`,
    `"${track.title}". ${genre}. Someone spent actual time prompting an AI to make this. And then someone else spent actual time rating it. What a world. ${ratingRoast}${noteRoast}`,
    `Alright alright, don't touch that dial — oh wait, there's no dial. You're stuck with me. Next up: "${track.title}", ${genre}. ${ratingRoast}${noteRoast}`,
    `Breaking news on VoteMyAI Radio: "${track.title}" exists. It's ${genre}. The community rated it with no idea who made it. ${ratingRoast}${noteRoast} Democracy at its finest.`,
  ];
  return intros[Math.floor(Math.random() * intros.length)];
}

// --- Password ---
function checkPassword() {
  const input = document.getElementById('pwInput').value;
  if (input === RADIO_PASSWORD) {
    document.getElementById('passwordGate').style.display = 'none';
    document.getElementById('radioApp').style.display = 'block';
  } else {
    document.getElementById('pwError').classList.add('show');
    document.getElementById('pwInput').value = '';
    setTimeout(() => document.getElementById('pwError').classList.remove('show'), 2000);
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});

// --- Start Radio (user interaction gate for autoplay) ---
async function startRadio() {
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('statusText').textContent = 'LOADING...';

  // Init SC Widget
  scWidgetObj = SC.Widget(document.getElementById('scWidget'));

  // Fetch real tracks from Supabase
  try {
    schedule = await fetchSchedule();
    if (schedule.length === 0) {
      document.getElementById('statusText').textContent = 'NO TRACKS';
      alert('No playable tracks found in the database!');
      return;
    }
    console.log(`📻 Radio loaded ${schedule.length} playable tracks`);
  } catch (err) {
    console.error('Failed to fetch schedule:', err);
    document.getElementById('statusText').textContent = 'ERROR';
    alert('Could not load tracks. Check console.');
    return;
  }

  document.getElementById('statusText').textContent = 'LOADING...';
  isPlaying = true;
  currentTrackIndex = -1;

  // Preload TTS voices
  await loadVoices();

  // No pre-validation — we use the buffer approach instead
  console.log(`📻 Radio loaded ${schedule.length} tracks, starting with buffer approach`);

  if (schedule.length === 0) {
    document.getElementById('statusText').textContent = 'NO TRACKS';
    alert('No playable tracks found!');
    return;
  }

  document.getElementById('statusText').textContent = 'TUNING IN...';

  // Find first working track and start
  const firstTrack = await findNextWorkingTrack();
  if (!firstTrack) {
    document.getElementById('statusText').textContent = 'NO TRACKS';
    alert('Could not find any working tracks!');
    return;
  }

  document.getElementById('statusText').textContent = 'LIVE';
  await playVerifiedTrack(firstTrack);
}

// --- TTS Voice Loading ---
let ttsVoices = [];
function loadVoices() {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { resolve(); return; }
    ttsVoices = window.speechSynthesis.getVoices();
    if (ttsVoices.length > 0) {
      console.log('🎙️ TTS voices loaded:', ttsVoices.length);
      resolve();
      return;
    }
    // Chrome loads voices async
    window.speechSynthesis.onvoiceschanged = () => {
      ttsVoices = window.speechSynthesis.getVoices();
      console.log('🎙️ TTS voices loaded (async):', ttsVoices.length);
      resolve();
    };
    // Timeout fallback
    setTimeout(resolve, 3000);
  });
}

function getPreferredVoice() {
  if (ttsVoices.length === 0) ttsVoices = window.speechSynthesis.getVoices();
  return ttsVoices.find(v => v.name.includes('Google') && v.lang.startsWith('en'))
    || ttsVoices.find(v => v.lang.startsWith('en-') && v.name.includes('Female'))
    || ttsVoices.find(v => v.lang.startsWith('en-'))
    || ttsVoices.find(v => v.lang.startsWith('en'))
    || ttsVoices[0] || null;
}

function speakText(text) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window) || ttsVoices.length === 0) {
      console.warn('🎙️ No TTS available, skipping voice intro');
      resolve();
      return;
    }

    // Chrome bug: cancel any stuck speech
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.92;  // Slower, more deliberate delivery
    utterance.pitch = 1.0;
    utterance.volume = document.getElementById('volumeSlider').value / 100;

    const voice = getPreferredVoice();
    if (voice) {
      utterance.voice = voice;
      console.log('🎙️ Using voice:', voice.name);
    }

    let resolved = false;
    const done = (reason) => {
      if (resolved) return;
      resolved = true;
      clearInterval(watchdog);
      console.log('🎙️ TTS done, reason:', reason || 'onend');
      resolve();
    };

    utterance.onend = () => done('onend');
    utterance.onerror = (e) => {
      console.warn('🎙️ TTS error:', e);
      done('error');
    };

    // Safety timeout — 20s max for longer savage intros
    setTimeout(() => done('timeout'), 20000);

    console.log('🎙️ Speaking:', text.substring(0, 60) + '...');
    window.speechSynthesis.speak(utterance);

    // AGGRESSIVE Chrome bug workaround:
    // Chrome pauses speechSynthesis after ~15s. We resume every 3s.
    // Also detect if speech stopped without firing onend.
    const watchdog = setInterval(() => {
      if (resolved) { clearInterval(watchdog); return; }

      if (window.speechSynthesis.speaking) {
        // Still speaking — do the pause/resume trick
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      } else {
        // Speech stopped but onend didn't fire — Chrome bug
        console.log('🎙️ Speech stopped silently, continuing');
        done('silent-end');
      }
    }, 2000);
  });
}

// --- Core Playback: Pre-Buffer Architecture ---
// The key idea: NEVER talk about a song until it's actually loaded and ready to play.
// 1. Try loading next track's audio in a buffer Audio element
// 2. If it loads (canplaythrough) → it's verified. Show host intro, speak, then play.
// 3. If it fails → silently skip to next, try again. No TTS, no UI update.

let bufferAudio = new Audio(); // Dedicated buffer for pre-loading
bufferAudio.preload = 'auto';
let allTracks = []; // Store all tracks for re-shuffling

// Genre-diverse reorder function (reusable for re-shuffles)
function genreDiverseShuffle(tracks) {
  // Top 100 by rating get 3x weight (appear ~3x more often)
  const sorted = [...tracks].sort((a, b) => (b.avg_rating || 0) - (a.avg_rating || 0));
  const top100 = sorted.slice(0, 100);
  const rest = sorted.slice(100);

  // Build weighted pool: top 100 appear 3x
  const pool = [...top100, ...top100, ...top100, ...rest];

  // Shuffle the pool
  const shuffled = pool
    .map(t => ({ ...t, _sort: Math.random() }))
    .sort((a, b) => a._sort - b._sort);

  // Genre-diverse reorder + dedupe consecutive same title
  const reordered = [];
  const remaining = [...shuffled];
  let lastGenre = '';
  let lastTitle = '';

  while (remaining.length > 0) {
    let idx = remaining.findIndex(t =>
      t.genre.toLowerCase() !== lastGenre.toLowerCase() &&
      t.title.toLowerCase() !== lastTitle.toLowerCase()
    );
    if (idx === -1) idx = remaining.findIndex(t =>
      t.title.toLowerCase() !== lastTitle.toLowerCase()
    );
    if (idx === -1) idx = 0;

    const track = remaining.splice(idx, 1)[0];
    reordered.push(track);
    lastGenre = track.genre;
    lastTitle = track.title;
  }

  return reordered;
}

// Find the next track that actually loads successfully
async function findNextWorkingTrack() {
  let attempts = 0;
  const maxAttempts = schedule.length;

  while (attempts < maxAttempts) {
    currentTrackIndex++;

    // Loop: re-shuffle when we reach the end
    if (currentTrackIndex >= schedule.length) {
      console.log('🔄 Playlist complete! Re-shuffling with fresh order...');
      schedule = genreDiverseShuffle(allTracks);
      currentTrackIndex = 0;
    }

    attempts++;

    const candidate = schedule[currentTrackIndex];

    if (candidate.platform === 'suno' && candidate.audio_url) {
      const loaded = await bufferLoadAudio(candidate.audio_url);
      if (loaded) {
        console.log(`✅ Buffered: "${candidate.title}"`);
        return candidate;
      } else {
        console.log(`⏭️ Silent skip (won't load): "${candidate.title}"`);
        continue;
      }
    } else if (candidate.youtube_id) {
      // YT can't easily be pre-tested, trust it
      console.log(`✅ YouTube track queued: "${candidate.title}"`);
      return candidate;
    } else if (candidate.soundcloud_url) {
      console.log(`✅ SoundCloud track queued: "${candidate.title}"`);
      return candidate;
    }
  }
  return null; // Nothing works
}

// Try to load audio into buffer — returns true if canplaythrough fires
function bufferLoadAudio(url) {
  return new Promise(resolve => {
    // Reset buffer
    bufferAudio.pause();
    bufferAudio.removeAttribute('src');

    let resolved = false;
    const done = (result) => {
      if (resolved) return;
      resolved = true;
      resolve(result);
    };

    bufferAudio.oncanplaythrough = () => done(true);
    bufferAudio.onerror = () => done(false);
    bufferAudio.onstalled = () => {}; // ignore stalls, wait for timeout

    // Timeout: if not loaded in 6 seconds, skip
    setTimeout(() => done(false), 6000);

    bufferAudio.src = url;
    bufferAudio.load();
  });
}

// Play a track that has already been verified/buffered
async function playVerifiedTrack(track) {
  console.log(`📻 Now playing [${currentTrackIndex + 1}/${schedule.length}]: "${track.title}" (${track.platform})`);

  // Update UI
  updateNowPlaying(track);
  updateUpNext();

  // Show host speaking indicator + speak intro
  const introText = showHostMessage(track);
  await speakText(introText);
  document.getElementById('hostMsg').classList.remove('visible');

  if (!isPlaying) return;

  // Play the track
  stopAllPlayers();

  if (track.platform === 'suno' && track.audio_url) {
    // Transfer buffered audio to the main player
    const audio = document.getElementById('audioPlayer');
    audio.src = bufferAudio.src;
    audio.volume = document.getElementById('volumeSlider').value / 100;
    audio.currentTime = 0;

    audio.onended = () => onTrackEnded();
    audio.onerror = () => {
      console.warn('🎵 Playback error, skipping');
      onTrackEnded();
    };
    audio.ontimeupdate = () => updateProgress(audio.currentTime, audio.duration);
    audio.onloadedmetadata = () => {
      document.getElementById('timeDuration').textContent = formatTime(audio.duration);
      setFallbackTimer(audio.duration);
    };
    setFallbackTimer(300);

    audio.play().then(() => {
      console.log('🎵 Playing:', track.title);
    }).catch(err => {
      console.warn('🎵 Play failed:', err.message);
      onTrackEnded();
    });

  } else if (track.platform === 'youtube' || track.youtube_id) {
    playYouTubeTrack(track);
  } else if (track.platform === 'soundcloud' || track.soundcloud_url) {
    playSoundCloudTrack(track);
  } else if (track.audio_url) {
    // Generic audio fallback
    const audio = document.getElementById('audioPlayer');
    audio.src = track.audio_url;
    audio.volume = document.getElementById('volumeSlider').value / 100;
    audio.onended = () => onTrackEnded();
    audio.onerror = () => onTrackEnded();
    audio.ontimeupdate = () => updateProgress(audio.currentTime, audio.duration);
    setFallbackTimer(300);
    audio.play().catch(() => onTrackEnded());
  } else {
    onTrackEnded();
  }

  // Start pre-buffering next track in background
  preBufferNext();
}

// Pre-buffer next working track while current is playing
let nextBufferedTrack = null;
async function preBufferNext() {
  nextBufferedTrack = null;
  let tempIndex = currentTrackIndex;
  let attempts = 0;

  while (attempts < schedule.length) {
    tempIndex++;
    if (tempIndex >= schedule.length) tempIndex = 0;
    attempts++;

    const candidate = schedule[tempIndex];

    if (candidate.platform === 'suno' && candidate.audio_url) {
      // Use a separate Audio element for pre-buffering
      const testAudio = new Audio();
      testAudio.preload = 'auto';
      const works = await new Promise(resolve => {
        let done = false;
        testAudio.oncanplaythrough = () => { if (!done) { done = true; resolve(true); } };
        testAudio.onerror = () => { if (!done) { done = true; resolve(false); } };
        setTimeout(() => { if (!done) { done = true; resolve(false); } }, 6000);
        testAudio.src = candidate.audio_url;
        testAudio.load();
      });

      if (works) {
        nextBufferedTrack = { track: candidate, index: tempIndex };
        console.log(`🔮 Pre-buffered next: "${candidate.title}"`);
        return;
      } else {
        console.log(`⏭️ Pre-buffer skip: "${candidate.title}"`);
        continue;
      }
    } else if (candidate.youtube_id || candidate.soundcloud_url) {
      nextBufferedTrack = { track: candidate, index: tempIndex };
      console.log(`🔮 Next queued (${candidate.platform}): "${candidate.title}"`);
      return;
    }
  }
  console.warn('🔮 No next track could be pre-buffered');
}

function showHostMessage(track) {
  const msg = generateHostIntro(track);
  const el = document.getElementById('hostMsg');
  el.classList.add('visible');

  // Hide when TTS is done (will also be hidden by speakText completing)
  setTimeout(() => {
    el.classList.remove('visible');
  }, 12000);

  return msg;
}

// (playTrack replaced by playVerifiedTrack above)

// --- Fallback timer (skips if track fails or hangs) ---
let fallbackTimer = null;
function setFallbackTimer(seconds) {
  clearFallbackTimer();
  const timeout = (seconds || 300) + 10; // track duration + 10s buffer, max 5min
  fallbackTimer = setTimeout(() => {
    console.warn('⏭️ Fallback timer triggered — skipping to next');
    onTrackEnded();
  }, timeout * 1000);
}
function clearFallbackTimer() {
  if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
}

// --- Platform Players ---

// (playSunoTrack logic moved into playVerifiedTrack)

function playYouTubeTrack(track) {
  if (!ytPlayer || !ytPlayer.loadVideoById) {
    console.warn('📺 YT Player not ready, skipping');
    setTimeout(() => onTrackEnded(), 500);
    return;
  }

  console.log('📺 Loading YouTube:', track.youtube_id);
  ytPlayer.loadVideoById(track.youtube_id);
  ytPlayer.setVolume(document.getElementById('volumeSlider').value);

  // Quick check: if YT hasn't started playing within 10s, skip
  let ytStarted = false;
  const ytQuickCheck = setTimeout(() => {
    if (!ytStarted) {
      console.warn('📺 YouTube failed to start within 10s, skipping:', track.title);
      onTrackEnded();
    }
  }, 10000);

  // Progress tracking for YT
  if (progressInterval) clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if (ytPlayer && ytPlayer.getCurrentTime) {
      const current = ytPlayer.getCurrentTime();
      const duration = ytPlayer.getDuration();
      if (current > 0.5) {
        ytStarted = true;
        clearTimeout(ytQuickCheck);
      }
      updateProgress(current, duration);
      if (duration > 0 && !fallbackTimer) setFallbackTimer(duration);
    }
  }, 500);

  // Max fallback
  setFallbackTimer(300);
}

function playSoundCloudTrack(track) {
  const scUrl = track.soundcloud_url || track.embed_url;

  if (!scUrl || !scWidgetObj) {
    console.warn('🔊 No SC URL or widget, skipping');
    setTimeout(() => onTrackEnded(), 500);
    return;
  }

  console.log('🔊 Loading SoundCloud:', scUrl);

  // Quick check: if SC hasn't started within 10s, skip
  let scStarted = false;
  const scQuickCheck = setTimeout(() => {
    if (!scStarted) {
      console.warn('🔊 SoundCloud failed to start within 10s, skipping:', track.title);
      onTrackEnded();
    }
  }, 10000);

  scWidgetObj.load(scUrl, {
    auto_play: true,
    show_artwork: false,
    show_user: false,
    hide_related: true,
    visual: false
  });

  // Rebind events after load
  scWidgetObj.bind(SC.Widget.Events.FINISH, () => {
    onTrackEnded();
  });

  scWidgetObj.bind(SC.Widget.Events.PLAY_PROGRESS, (data) => {
    if (!scStarted) {
      scStarted = true;
      clearTimeout(scQuickCheck);
    }
    scWidgetObj.getDuration(duration => {
      updateProgress(data.currentPosition / 1000, duration / 1000);
      if (duration > 0 && !fallbackTimer) setFallbackTimer(duration / 1000);
    });
  });

  scWidgetObj.bind(SC.Widget.Events.ERROR, () => {
    console.warn('SC Widget error, skipping');
    onTrackEnded();
  });

  // Fallback
  setFallbackTimer(360);
}

// --- On Track Ended (Central Flow) ---
let isTransitioning = false;
async function onTrackEnded() {
  if (isTransitioning) return;
  isTransitioning = true;

  if (progressInterval) clearInterval(progressInterval);
  clearFallbackTimer();
  document.getElementById('progressBar').style.width = '0%';

  if (!isPlaying) { isTransitioning = false; return; }

  // Use pre-buffered track if available, otherwise find one
  let nextTrack;
  if (nextBufferedTrack) {
    currentTrackIndex = nextBufferedTrack.index;
    nextTrack = nextBufferedTrack.track;
    nextBufferedTrack = null;
    console.log(`📻 Using pre-buffered: "${nextTrack.title}"`);
  } else {
    nextTrack = await findNextWorkingTrack();
  }

  isTransitioning = false;

  if (nextTrack) {
    await playVerifiedTrack(nextTrack);
  } else {
    console.error('📻 No more playable tracks');
    document.getElementById('statusText').textContent = 'NO TRACKS';
  }
}

// --- Stop All Players ---
function stopAllPlayers() {
  clearFallbackTimer();

  // Stop <audio> — use pause + removeAttribute to avoid layout thrash
  const audio = document.getElementById('audioPlayer');
  audio.pause();
  audio.onended = null;
  audio.ontimeupdate = null;
  audio.onerror = null;
  audio.removeAttribute('src');
  audio.load(); // reset without triggering visible changes

  // Stop YouTube
  if (ytPlayer && ytPlayer.stopVideo) {
    try { ytPlayer.stopVideo(); } catch (e) {}
  }
  if (progressInterval) clearInterval(progressInterval);

  // Stop SoundCloud
  if (scWidgetObj) {
    try { scWidgetObj.pause(); } catch (e) {}
  }
}

// --- UI Updates ---
function updateNowPlaying(track) {
  document.getElementById('npTitle').textContent = track.title;
  document.getElementById('npGenre').textContent = track.genre;
  document.getElementById('npPlatform').textContent = track.platform.toUpperCase();
  document.getElementById('npRating').textContent = track.avg_rating ? track.avg_rating.toFixed(1) : '—';
  document.getElementById('timeDuration').textContent =
    track.duration_seconds ? formatTime(track.duration_seconds) : '—';
  document.getElementById('timeElapsed').textContent = '0:00';
  document.getElementById('progressBar').style.width = '0%';

  // Artist note
  const noteEl = document.getElementById('artistNote');
  if (track.artist_note) {
    document.getElementById('artistNoteText').textContent = track.artist_note;
    noteEl.classList.add('visible');
  } else {
    noteEl.classList.remove('visible');
  }
}

function updateUpNext() {
  const list = document.getElementById('upNextList');
  list.innerHTML = '';
  for (let i = 1; i <= 3; i++) {
    const idx = (currentTrackIndex + i) % schedule.length;
    const track = schedule[idx];
    const item = document.createElement('div');
    item.className = 'up-next-item';
    item.innerHTML = `
      <div class="up-next-num">${i}</div>
      <div class="up-next-info">
        <div class="up-next-title">${track.title}</div>
        <div class="up-next-genre">${track.genre} · ${track.platform.toUpperCase()}</div>
      </div>
      <div class="up-next-rating">★ ${track.avg_rating.toFixed(1)}</div>
    `;
    list.appendChild(item);
  }
}

function updateProgress(current, duration) {
  if (!duration || duration <= 0) return;
  const pct = Math.min((current / duration) * 100, 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('timeElapsed').textContent = formatTime(current);
  document.getElementById('timeDuration').textContent = formatTime(duration);
}

function updatePlayButton(playing) {
  // Play button removed for live radio mode — no-op
}

// --- Controls removed for live radio mode ---

// Volume
document.getElementById('volumeSlider').addEventListener('input', function() {
  const vol = this.value / 100;
  document.getElementById('audioPlayer').volume = vol;
  if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(this.value);
  if (scWidgetObj) scWidgetObj.setVolume(this.value);
});

// --- Helpers ---
function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// --- Fake listeners count ---
setInterval(() => {
  if (isPlaying) {
    const count = Math.floor(Math.random() * 8) + 3;
    document.getElementById('listenersCount').textContent = `${count} listeners tuned in`;
  }
}, 10000);
