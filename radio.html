<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoteMyAI Radio 📻</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --accent: #ff3d5a;
  --accent2: #ff6b3d;
  --accent-glow: rgba(255, 61, 90, 0.3);
  --text: #e8e6f0;
  --text-dim: #7a7890;
  --text-bright: #ffffff;
  --border: #2a2a3a;
  --green: #3dff8f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* === PASSWORD GATE === */
#passwordGate {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
}
#passwordGate h1 {
  font-size: 2rem; font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#passwordGate input {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 14px 20px; border-radius: 12px;
  font-size: 1rem; width: 280px; text-align: center;
  font-family: 'Space Mono', monospace;
  outline: none; transition: border-color 0.2s;
}
#passwordGate input:focus { border-color: var(--accent); }
#passwordGate button {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white; border: none; padding: 14px 40px; border-radius: 12px;
  font-size: 1rem; font-weight: 600; cursor: pointer;
  font-family: 'Outfit', sans-serif;
  transition: transform 0.15s, box-shadow 0.15s;
}
#passwordGate button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px var(--accent-glow);
}
#passwordGate .error {
  color: var(--accent); font-size: 0.85rem;
  opacity: 0; transition: opacity 0.3s;
}
#passwordGate .error.show { opacity: 1; }

/* === MAIN RADIO UI === */
#radioApp { display: none; }

.radio-bg {
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,61,90,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 100%, rgba(255,107,61,0.05) 0%, transparent 50%),
              var(--bg);
}

.container {
  max-width: 600px; margin: 0 auto; padding: 20px;
  min-height: 100vh; display: flex; flex-direction: column;
  overflow-anchor: none;
}

/* Header */
.header {
  text-align: center; padding: 30px 0 24px;
}
.header .badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  padding: 6px 14px; border-radius: 100px;
  font-size: 0.75rem; color: var(--text-dim);
  font-family: 'Space Mono', monospace;
  margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
}
.header .badge .live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  animation: pulse 1.5s ease infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(61,255,143,0.4); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(61,255,143,0); }
}
.header h1 {
  font-size: 2rem; font-weight: 900; letter-spacing: -1px;
  background: linear-gradient(135deg, var(--text-bright), var(--text));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header h1 span {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-dim); padding: 6px 14px; border-radius: 100px;
  font-size: 0.72rem; cursor: pointer; margin-top: 10px;
  font-family: 'Space Mono', monospace;
  transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
}
.back-btn:hover { border-color: var(--accent); color: var(--text-bright); }

/* Now Playing Card */
.now-playing {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 24px;
  margin-bottom: 16px;
  position: relative; overflow: hidden;
}
.now-playing::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  background-size: 200% 100%;
  animation: shimmer 3s ease infinite;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.np-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem; color: var(--accent);
  text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

/* Equalizer bars */
.eq-bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
.eq-bars .bar {
  width: 3px; background: var(--accent); border-radius: 1px;
  animation: eq 0.8s ease-in-out infinite alternate;
}
.eq-bars .bar:nth-child(1) { height: 40%; animation-delay: 0s; }
.eq-bars .bar:nth-child(2) { height: 80%; animation-delay: 0.15s; }
.eq-bars .bar:nth-child(3) { height: 50%; animation-delay: 0.3s; }
.eq-bars .bar:nth-child(4) { height: 100%; animation-delay: 0.1s; }
.eq-bars .bar:nth-child(5) { height: 60%; animation-delay: 0.25s; }
@keyframes eq {
  0% { transform: scaleY(0.3); }
  100% { transform: scaleY(1); }
}

.np-title {
  font-size: 1.4rem; font-weight: 800; color: var(--text-bright);
  margin-bottom: 6px; line-height: 1.2;
}
.np-meta {
  font-size: 0.85rem; color: var(--text-dim); margin-bottom: 14px;
}
.np-meta .platform {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  background: var(--surface2); font-size: 0.7rem;
  font-family: 'Space Mono', monospace;
  border: 1px solid var(--border);
}
.np-stats {
  display: flex; gap: 16px; margin-bottom: 14px;
}
.np-stat {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.85rem; color: var(--text-dim);
}
.np-stat .val { color: var(--text-bright); font-weight: 600; }

/* Progress bar */
.progress-wrap {
  width: 100%; height: 4px; background: var(--surface2);
  border-radius: 10px; overflow: hidden; margin-bottom: 6px;
}
.progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 10px; transition: width 0.5s linear;
}
.progress-time {
  display: flex; justify-content: space-between;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem; color: var(--text-dim);
}

/* Artist Note */
.artist-note {
  background: var(--surface2); border-left: 3px solid var(--accent2);
  padding: 0 16px; border-radius: 0 12px 12px 0;
  margin-top: 0; max-height: 0; overflow: hidden; opacity: 0;
  transition: all 0.4s ease;
}
.artist-note.visible {
  padding: 12px 16px; margin-top: 14px;
  max-height: 200px; opacity: 1;
}
.artist-note .label {
  font-size: 0.65rem; color: var(--accent2);
  text-transform: uppercase; letter-spacing: 1px;
  font-family: 'Space Mono', monospace;
  margin-bottom: 4px;
}
.artist-note .text {
  font-size: 0.85rem; color: var(--text); font-style: italic;
  line-height: 1.4;
}

/* Host Speaking Indicator */
.host-msg {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  opacity: 0; max-height: 0; overflow: hidden;
  transition: opacity 0.4s ease, max-height 0.4s ease, padding 0.4s ease, margin 0.4s ease;
  padding: 0 24px; margin-bottom: 0;
}
.host-msg.visible {
  opacity: 1; max-height: 100px;
  padding: 16px 24px; margin-bottom: 16px;
}
.host-msg .host-header {
  display: flex; align-items: center; gap: 10px;
}
.host-msg .host-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem;
}
.host-msg .host-name {
  font-weight: 700; font-size: 0.85rem; color: var(--text-bright);
}
.host-msg .host-role {
  font-size: 0.65rem; color: var(--accent);
  font-family: 'Space Mono', monospace;
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  50% { opacity: 0.4; }
}

/* Volume */
.controls {
  display: flex; align-items: center; justify-content: center;
  padding: 14px 0;
}
.volume-wrap {
  display: flex; align-items: center; gap: 8px;
}
.volume-wrap svg { fill: var(--text-dim); width: 18px; flex-shrink: 0; }
.volume-wrap input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100px; height: 4px; background: var(--surface2);
  border-radius: 4px; outline: none;
}
.volume-wrap input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  box-shadow: 0 0 8px var(--accent-glow);
}
.volume-wrap input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: none;
}

/* Up Next */
.up-next {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 18px 22px; margin-bottom: 20px;
}
.up-next h3 {
  font-size: 0.65rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 2px;
  font-family: 'Space Mono', monospace;
  margin-bottom: 12px;
}
.up-next-item {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.up-next-item:last-child { border-bottom: none; }
.up-next-num {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem; color: var(--text-dim);
  width: 20px; text-align: center;
}
.up-next-info { flex: 1; min-width: 0; }
.up-next-title {
  font-weight: 600; font-size: 0.85rem; color: var(--text-bright);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.up-next-genre { font-size: 0.7rem; color: var(--text-dim); }
.up-next-rating {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem; color: var(--accent2); flex-shrink: 0;
}

/* Footer */
.radio-footer {
  text-align: center; padding: 20px 0 40px;
  margin-top: auto;
}
.radio-footer a {
  color: var(--text-dim); text-decoration: none;
  font-size: 0.75rem; font-family: 'Space Mono', monospace;
  transition: color 0.2s;
}
.radio-footer a:hover { color: var(--accent); }

/* Channel Grid */
.channel-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px; padding: 10px 0;
  max-width: 400px; margin: 0 auto;
}
.channel-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 10px;
  cursor: pointer; transition: all 0.2s;
  display: flex; flex-direction: column;
  align-items: center; gap: 4px; text-align: center;
  color: var(--text);
}
.channel-card:hover {
  border-color: var(--accent);
  background: rgba(255, 61, 90, 0.08);
  transform: translateY(-2px);
}
.channel-card.main-channel {
  grid-column: span 3;
  flex-direction: row; justify-content: center; gap: 12px;
  padding: 18px 20px;
  background: linear-gradient(135deg, rgba(255,61,90,0.08), rgba(255,107,61,0.06));
  border-color: var(--accent);
}
.channel-card.main-channel .channel-icon { font-size: 2rem; }
.channel-card.main-channel .channel-text { text-align: left; }
.channel-card.trending {
  border-color: var(--accent2);
  background: rgba(255, 107, 61, 0.06);
}
.channel-icon { font-size: 1.8rem; line-height: 1; }
.channel-name {
  font-weight: 700; font-size: 0.8rem;
  color: var(--text-bright); letter-spacing: 0.5px;
}
.channel-desc {
  font-size: 0.6rem; color: var(--text-dim);
  font-family: 'Space Mono', monospace;
}
.channel-count {
  font-size: 0.55rem; color: var(--text-dim);
  font-family: 'Space Mono', monospace;
  opacity: 0.7;
}

/* Start overlay */
#startOverlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(10,10,15,0.97);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 20px; padding: 20px;
  backdrop-filter: blur(20px);
}
#startOverlay h2 {
  font-size: 1.8rem; font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#startOverlay p { color: var(--text-dim); font-size: 0.9rem; }

/* Hidden players */
#hiddenPlayers {
  position: fixed; top: -9999px; left: -9999px;
  width: 1px; height: 1px; overflow: hidden;
}

/* Responsive */
@media (max-width: 480px) {
  .header h1 { font-size: 1.5rem; }
  .np-title { font-size: 1.2rem; }
  .container { padding: 12px; }
  .channel-grid { grid-template-columns: repeat(2, 1fr); }
  .channel-card.main-channel { grid-column: span 2; }
}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="passwordGate">
  <h1>📻 VoteMyAI Radio</h1>
  <p style="color: var(--text-dim); font-size: 0.9rem;">Invite only — enter the code</p>
  <input type="password" id="pwInput" placeholder="••••••••" autofocus>
  <button onclick="checkPassword()">Enter</button>
  <div class="error" id="pwError">Wrong code, try again</div>
</div>

<!-- RADIO APP -->
<div id="radioApp">
  <div class="radio-bg"></div>

  <!-- Channel Picker -->
  <div id="startOverlay">
    <h2>📻 VoteMyAI Radio</h2>
    <p>AI-hosted radio · community-submitted AI music</p>
    <div class="channel-grid" id="channelGrid">
      <button class="channel-card main-channel" onclick="startRadio('all')">

      <button class="channel-card" onclick="startRadio('pop')">
        <span class="channel-icon">🎤</span>
        <span class="channel-name">Pop</span>
        <span class="channel-desc">Catchy vibes</span>
      </button>
      <button class="channel-card" onclick="startRadio('rock')">
        <span class="channel-icon">🎸</span>
        <span class="channel-name">Rock</span>
        <span class="channel-desc">Riffs & power</span>
      </button>
      <button class="channel-card" onclick="startRadio('hip-hop')">
        <span class="channel-icon">🎧</span>
        <span class="channel-name">Hip-Hop</span>
        <span class="channel-desc">Beats & bars</span>
      </button>
      <button class="channel-card" onclick="startRadio('metal')">
        <span class="channel-icon">🤘</span>
        <span class="channel-name">Metal</span>
        <span class="channel-desc">Heavy stuff</span>
      </button>
      <button class="channel-card" onclick="startRadio('electronic')">
        <span class="channel-icon">🎛️</span>
        <span class="channel-name">Electronic</span>
        <span class="channel-desc">Synths & drops</span>
      </button>
      <button class="channel-card" onclick="startRadio('country')">
        <span class="channel-icon">🤠</span>
        <span class="channel-name">Country</span>
        <span class="channel-desc">Twang & soul</span>
      </button>
      <button class="channel-card" onclick="startRadio('chill')">
        <span class="channel-icon">🧘</span>
        <span class="channel-name">Chill</span>
        <span class="channel-desc">Lo-Fi & ambient</span>
      </button>
    </div>
    <p style="font-size: 0.7rem; color: var(--text-dim);">Pick a channel to tune in</p>
  </div>

  <div class="container">
    <div class="header">
      <div class="badge">
        <span class="live-dot"></span>
        <span id="statusText">OFFLINE</span>
      </div>
      <h1>VoteMyAI <span>Radio</span></h1>
      <button class="back-btn" id="backBtn" onclick="goBackToChannels()" style="display:none;">← Channels</button>
    </div>

    <!-- Host Speaking Indicator -->
    <div class="host-msg" id="hostMsg">
      <div class="host-header">
        <div class="host-avatar">🎙️</div>
        <div>
          <div class="host-name">DJ VoteBot</div>
          <div class="host-role">SPEAKING...</div>
        </div>
      </div>
    </div>

    <!-- Now Playing -->
    <div class="now-playing" id="nowPlaying">
      <div class="np-label">
        <div class="eq-bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        Now Playing
      </div>
      <div class="np-title" id="npTitle">—</div>
      <div class="np-meta">
        <span id="npGenre">—</span> · <span class="platform" id="npPlatform">—</span>
      </div>
      <div class="np-stats">
        <div class="np-stat">⭐ <span class="val" id="npRating">—</span></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-time">
        <span id="timeElapsed">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>
      <div class="artist-note" id="artistNote">
        <div class="label">Artist Note</div>
        <div class="text" id="artistNoteText"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="volume-wrap">
        <svg viewBox="0 0 24 24" width="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.5v7a4.47 4.47 0 002.5-3.5z"/></svg>
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </div>

    <!-- Up Next -->
    <div class="up-next" id="upNext">
      <h3>Up Next</h3>
      <div id="upNextList"></div>
    </div>

    <!-- Footer -->
    <div class="radio-footer">
      <a href="https://votemyai.com" target="_blank">votemyai.com</a>
    </div>
  </div>
</div>

<!-- Hidden audio player -->
<div id="hiddenPlayers">
  <audio id="audioPlayer" preload="auto"></audio>
</div>

// --- Fetch & normalize tracks ---
async function fetchSchedule() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/tracks?select=*&order=avg_rating.desc&limit=500`,
    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
  );
  const tracks = await res.json();

  // Shuffle with rating weight
  const shuffled = tracks
    .map(t => ({ ...t, sort: Math.random() * (t.avg_rating || 1) }))
    .sort((a, b) => b.sort - a.sort);

  const mapped = shuffled.map(t => {
    const platform = (t.tool || '').toLowerCase();
    let suno_id = null, audio_url = null;

    // Detect from actual URL content
    if (t.embed_url) {
      const match = t.embed_url.match(/suno\.com\/song\/([a-f0-9-]+)/i);
      if (match) {
        suno_id = match[1];
        audio_url = `https://cdn1.suno.ai/${suno_id}.mp3`;
      }
    }

    return {
      id: t.id,
      title: t.title || 'Untitled',
      genre: t.genre || 'Unknown',
      platform: audio_url ? 'suno' : platform,
      artist_note: t.artist_note || null,
      avg_rating: t.avg_rating || 0,
      audio_url: audio_url,
    };
  }).filter(t => !!t.audio_url);

  // Apply channel filter
  let filtered = mapped;
  if (currentChannel === 'trending') {
    filtered = [...mapped].sort((a, b) => (b.avg_rating || 0) - (a.avg_rating || 0)).slice(0, 50);
  } else if (CHANNEL_GENRES[currentChannel]) {
    const genres = CHANNEL_GENRES[currentChannel];
    filtered = mapped.filter(t => {
      const g = (t.genre || '').toLowerCase();
      return genres.some(genre => g.includes(genre));
    });
  }

  if (filtered.length < 3 && currentChannel !== 'all') {
    console.warn(`📻 Only ${filtered.length} tracks for channel "${currentChannel}"`);
  }

  allTracks = [...filtered];
  const reordered = genreDiverseShuffle(allTracks);
  console.log(`📻 Channel "${currentChannel}": ${reordered.length} tracks (from ${mapped.length} total)`);
  return reordered;
}

// --- Genre-diverse shuffle ---
function genreDiverseShuffle(tracks) {
  let pool;
  if (currentChannel === 'trending') {
    pool = [...tracks];
  } else {
    const sorted = [...tracks].sort((a, b) => (b.avg_rating || 0) - (a.avg_rating || 0));
    const topN = Math.min(100, sorted.length);
    const top = sorted.slice(0, topN);
    const rest = sorted.slice(topN);
    pool = [...top, ...top, ...rest]; // Top tracks 2x, not 3x
  }

  const shuffled = pool
    .map(t => ({ ...t, _sort: Math.random() }))
    .sort((a, b) => a._sort - b._sort);

  const reordered = [];
  const remaining = [...shuffled];
  let lastGenre = '', lastTitle = '';

  while (remaining.length > 0) {
    let idx = remaining.findIndex(t =>
      t.genre.toLowerCase() !== lastGenre.toLowerCase() &&
      t.title.toLowerCase() !== lastTitle.toLowerCase()
    );
    if (idx === -1) idx = remaining.findIndex(t =>
      t.title.toLowerCase() !== lastTitle.toLowerCase()
    );
    if (idx === -1) idx = 0;

    const track = remaining.splice(idx, 1)[0];
    reordered.push(track);
    lastGenre = track.genre;
    lastTitle = track.title;
  }
  return reordered;
}

// --- Host personality ---
function generateHostIntro(track) {
  const stars = track.avg_rating ? track.avg_rating.toFixed(1) : null;
  const note = track.artist_note || null;
  const genre = track.genre || 'unknown genre';

  let ratingRoast = '';
  if (stars) {
    const s = parseFloat(stars);
    if (s >= 4.5) ratingRoast = `${stars} stars. Yeah, the people have spoken, and apparently they have terrible taste.`;
    else if (s >= 4.0) ratingRoast = `Sitting at ${stars} stars. Not bad. Not good either, but not bad.`;
    else if (s >= 3.5) ratingRoast = `${stars} stars. That's a solid... meh.`;
    else if (s >= 3.0) ratingRoast = `${stars} stars. Ouch. The community did NOT hold back on this one.`;
    else ratingRoast = `${stars} stars. That's rough buddy. Real rough.`;
  }

  let noteRoast = '';
  if (note) {
    const reactions = [
      `The artist wrote a note: "${note}". Sure buddy. Sure.`,
      `Artist note says: "${note}". I mean, okay? Nobody asked, but okay.`,
      `And I quote the artist: "${note}". The confidence. I respect it.`,
      `The artist left a message: "${note}". Bold move.`,
    ];
    noteRoast = ' ' + reactions[Math.floor(Math.random() * reactions.length)];
  }

  const intros = [
    `Alright, buckle up. Next is "${track.title}". ${genre}. ${ratingRoast}${noteRoast} Here we go.`,
    `Oh boy, here comes "${track.title}". ${genre}, because of course it is. ${ratingRoast}${noteRoast}`,
    `Next on VoteMyAI Radio — "${track.title}". ${genre}. I don't make the playlist, I just judge it. ${ratingRoast}${noteRoast}`,
    `"${track.title}" is up. ${genre}. You can't skip, this is live radio baby! ${ratingRoast}${noteRoast}`,
    `This is VoteMyAI Radio, where AI makes the music and humans pretend to enjoy it. "${track.title}", ${genre}. ${ratingRoast}${noteRoast}`,
    `Somebody submitted "${track.title}". ${genre}. No clout bias here — just blind, questionable judgment. ${ratingRoast}${noteRoast}`,
    `Welcome back. Did you miss me? No? Too bad. Here's "${track.title}", ${genre}. ${ratingRoast}${noteRoast}`,
    `Breaking news on VoteMyAI Radio: "${track.title}" exists. ${genre}. ${ratingRoast}${noteRoast} Democracy at its finest.`,
    `"${track.title}". ${genre}. Someone spent actual time prompting an AI to make this. What a world. ${ratingRoast}${noteRoast}`,
    `Don't touch that dial! "${track.title}", ${genre}. ${ratingRoast}${noteRoast}`,
  ];
  return intros[Math.floor(Math.random() * intros.length)];
}

// --- TTS ---
let ttsVoices = [];
function loadVoices() {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { resolve(); return; }
    ttsVoices = window.speechSynthesis.getVoices();
    if (ttsVoices.length > 0) { resolve(); return; }
    window.speechSynthesis.onvoiceschanged = () => {
      ttsVoices = window.speechSynthesis.getVoices();
      console.log('🎙️ TTS voices loaded (async):', ttsVoices.length);
      resolve();
    };
    setTimeout(resolve, 3000);
  });
}

function getPreferredVoice() {
  const prefs = ['Google US English', 'Google UK English Female', 'Samantha', 'Alex'];
  for (const name of prefs) {
    const v = ttsVoices.find(v => v.name.includes(name));
    if (v) return v;
  }
  return ttsVoices.find(v => v.lang.startsWith('en')) || ttsVoices[0] || null;
}

function speakText(text) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window) || ttsVoices.length === 0) { resolve(); return; }

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.92;
    utterance.pitch = 1.0;
    utterance.volume = document.getElementById('volumeSlider').value / 100;

    const voice = getPreferredVoice();
    if (voice) { utterance.voice = voice; console.log('🎙️ Using voice:', voice.name); }

    let resolved = false;
    const done = (reason) => {
      if (resolved) return;
      resolved = true;
      clearInterval(watchdog);
      console.log('🎙️ TTS done, reason:', reason);
      resolve();
    };

    utterance.onend = () => done('onend');
    utterance.onerror = () => done('error');
    setTimeout(() => done('timeout'), 20000);

    console.log('🎙️ Speaking:', text.substring(0, 60) + '...');
    window.speechSynthesis.speak(utterance);

    const watchdog = setInterval(() => {
      if (resolved) { clearInterval(watchdog); return; }
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      } else {
        done('silent-end');
      }
    }, 2000);
  });
}

// --- Start Radio ---
async function startRadio(channel = 'all') {
  currentChannel = channel;
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('statusText').textContent = 'LOADING...';
  document.getElementById('backBtn').style.display = 'inline-flex';

  try {
    schedule = await fetchSchedule();
    if (schedule.length === 0) {
      document.getElementById('statusText').textContent = 'NO TRACKS';
      alert('No playable tracks found for this channel!');
      goBackToChannels();
      return;
    }
    console.log(`📻 Radio loaded ${schedule.length} playable tracks`);

    // Show channel name
    document.querySelector('.header h1').innerHTML =
      `VoteMyAI <span>Radio</span><div style="font-size:0.45em;color:var(--accent2);font-weight:400;margin-top:4px;">${CHANNEL_NAMES[currentChannel] || 'The Blind Mix'} · ${allTracks.length} tracks</div>`;

  } catch (err) {
    console.error('Failed to fetch schedule:', err);
    document.getElementById('statusText').textContent = 'ERROR';
    return;
  }

  isPlaying = true;
  currentTrackIndex = -1;
  await loadVoices();

  console.log(`📻 Radio loaded ${schedule.length} tracks, starting`);

  document.getElementById('statusText').textContent = 'TUNING IN...';
  const firstTrack = await findNextWorkingTrack();
  if (!firstTrack) {
    document.getElementById('statusText').textContent = 'NO TRACKS';
    return;
  }

  document.getElementById('statusText').textContent = 'LIVE';
  await playVerifiedTrack(firstTrack);
}

// --- Back to channels ---
function goBackToChannels() {
  isPlaying = false;
  stopAllPlayers();
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('startOverlay').style.display = 'flex';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('statusText').textContent = 'OFFLINE';
  document.querySelector('.header h1').innerHTML = 'VoteMyAI <span>Radio</span>';
  document.getElementById('npTitle').textContent = '—';
  document.getElementById('upNextList').innerHTML = '';
}

// --- Core Playback: Pre-Buffer Architecture ---
async function findNextWorkingTrack() {
  let attempts = 0;
  while (attempts < schedule.length) {
    currentTrackIndex++;
    if (currentTrackIndex >= schedule.length) {
      console.log('🔄 Playlist complete! Re-shuffling...');
      schedule = genreDiverseShuffle(allTracks);
      currentTrackIndex = 0;
    }
    attempts++;

    const candidate = schedule[currentTrackIndex];
    if (candidate.audio_url) {
      const loaded = await bufferLoadAudio(candidate.audio_url);
      if (loaded) {
        console.log(`✅ Buffered: "${candidate.title}"`);
        return candidate;
      } else {
        console.log(`⏭️ Skip (broken): "${candidate.title}"`);
      }
    }
  }
  return null;
}

function bufferLoadAudio(url) {
  return new Promise(resolve => {
    bufferAudio.pause();
    bufferAudio.removeAttribute('src');
    let resolved = false;
    const done = (r) => { if (!resolved) { resolved = true; resolve(r); } };
    bufferAudio.oncanplaythrough = () => done(true);
    bufferAudio.onerror = () => done(false);
    setTimeout(() => done(false), 6000);
    bufferAudio.src = url;
    bufferAudio.load();
  });
}

async function playVerifiedTrack(track) {
  console.log(`📻 Now playing [${currentTrackIndex + 1}/${schedule.length}]: "${track.title}" (${track.platform})`);

  updateNowPlaying(track);
  updateUpNext();

  // Host intro
  const el = document.getElementById('hostMsg');
  el.classList.add('visible');
  const introText = generateHostIntro(track);
  await speakText(introText);
  el.classList.remove('visible');

  if (!isPlaying) return;

  // Play
  stopAllPlayers();
  const audio = document.getElementById('audioPlayer');
  audio.src = track.audio_url;
  audio.volume = document.getElementById('volumeSlider').value / 100;

  audio.onended = () => onTrackEnded();
  audio.onerror = () => { console.warn('🎵 Error, skipping'); onTrackEnded(); };
  audio.ontimeupdate = () => updateProgress(audio.currentTime, audio.duration);
  audio.onloadedmetadata = () => {
    document.getElementById('timeDuration').textContent = formatTime(audio.duration);
    setFallbackTimer(audio.duration);
  };
  setFallbackTimer(300);

  audio.play().then(() => {
    console.log('🎵 Playing:', track.title);
  }).catch(err => {
    console.warn('🎵 Play failed:', err.message);
    onTrackEnded();
  });

  preBufferNext();
}

async function preBufferNext() {
  nextBufferedTrack = null;
  let tempIndex = currentTrackIndex;
  let attempts = 0;

  while (attempts < schedule.length) {
    tempIndex++;
    if (tempIndex >= schedule.length) tempIndex = 0;
    attempts++;

    const candidate = schedule[tempIndex];
    if (candidate.audio_url) {
      const testAudio = new Audio();
      testAudio.preload = 'auto';
      const works = await new Promise(resolve => {
        let done = false;
        testAudio.oncanplaythrough = () => { if (!done) { done = true; resolve(true); } };
        testAudio.onerror = () => { if (!done) { done = true; resolve(false); } };
        setTimeout(() => { if (!done) { done = true; resolve(false); } }, 6000);
        testAudio.src = candidate.audio_url;
        testAudio.load();
      });

      if (works) {
        nextBufferedTrack = { track: candidate, index: tempIndex };
        console.log(`🔮 Pre-buffered next: "${candidate.title}"`);
        return;
      } else {
        console.log(`⏭️ Pre-buffer skip: "${candidate.title}"`);
      }
    }
  }
}

// --- Track Ended ---
let isTransitioning = false;
async function onTrackEnded() {
  if (isTransitioning) return;
  isTransitioning = true;

  if (progressInterval) clearInterval(progressInterval);
  clearFallbackTimer();
  document.getElementById('progressBar').style.width = '0%';

  if (!isPlaying) { isTransitioning = false; return; }

  let nextTrack;
  if (nextBufferedTrack) {
    currentTrackIndex = nextBufferedTrack.index;
    nextTrack = nextBufferedTrack.track;
    nextBufferedTrack = null;
    console.log(`📻 Using pre-buffered: "${nextTrack.title}"`);
  } else {
    nextTrack = await findNextWorkingTrack();
  }

  isTransitioning = false;

  if (nextTrack) {
    await playVerifiedTrack(nextTrack);
  } else {
    document.getElementById('statusText').textContent = 'NO TRACKS';
  }
}

// --- Stop All ---
function stopAllPlayers() {
  clearFallbackTimer();
  const audio = document.getElementById('audioPlayer');
  audio.pause();
  audio.onended = null;
  audio.ontimeupdate = null;
  audio.onerror = null;
  audio.removeAttribute('src');
  audio.load();
  try { bufferAudio.pause(); bufferAudio.removeAttribute('src'); } catch (e) {}
}

// --- Fallback timer ---
let fallbackTimer = null;
function setFallbackTimer(seconds) {
  clearFallbackTimer();
  const timeout = (seconds || 300) + 10;
  fallbackTimer = setTimeout(() => {
    console.warn('⏭️ Fallback timer triggered');
    onTrackEnded();
  }, timeout * 1000);
}
function clearFallbackTimer() {
  if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
}

// --- UI Updates ---
function updateNowPlaying(track) {
  document.getElementById('npTitle').textContent = track.title;
  document.getElementById('npGenre').textContent = track.genre;
  document.getElementById('npPlatform').textContent = track.platform.toUpperCase();
  document.getElementById('npRating').textContent = track.avg_rating ? track.avg_rating.toFixed(1) : '—';
  document.getElementById('timeDuration').textContent = '—';
  document.getElementById('timeElapsed').textContent = '0:00';
  document.getElementById('progressBar').style.width = '0%';

  const noteEl = document.getElementById('artistNote');
  if (track.artist_note) {
    document.getElementById('artistNoteText').textContent = track.artist_note;
    noteEl.classList.add('visible');
  } else {
    noteEl.classList.remove('visible');
  }
}

function updateUpNext() {
  const list = document.getElementById('upNextList');
  list.innerHTML = '';
  for (let i = 1; i <= 3; i++) {
    const idx = (currentTrackIndex + i) % schedule.length;
    const track = schedule[idx];
    if (!track) continue;
    const item = document.createElement('div');
    item.className = 'up-next-item';
    item.innerHTML = `
      <div class="up-next-num">${i}</div>
      <div class="up-next-info">
        <div class="up-next-title">${track.title}</div>
        <div class="up-next-genre">${track.genre}</div>
      </div>
      <div class="up-next-rating">★ ${track.avg_rating ? track.avg_rating.toFixed(1) : '—'}</div>
    `;
    list.appendChild(item);
  }
}

function updateProgress(current, duration) {
  if (!duration || duration <= 0) return;
  const pct = Math.min((current / duration) * 100, 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('timeElapsed').textContent = formatTime(current);
  document.getElementById('timeDuration').textContent = formatTime(duration);
}

// --- Volume ---
document.getElementById('volumeSlider').addEventListener('input', function() {
  document.getElementById('audioPlayer').volume = this.value / 100;
});

// --- Helpers ---
function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}
