<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap');

  body {
    width: 300px;
    height: 250px;
    overflow: hidden;
    background: #07070B;
    font-family: 'DM Sans', sans-serif;
  }

  .banner {
    width: 300px;
    height: 250px;
    background: #07070B;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid #1a1a24;
  }

  /* Animated background grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,255,71,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.04) 1px, transparent 1px);
    background-size: 30px 30px;
    animation: gridMove 8s linear infinite;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 30px; }
  }

  /* Glow blob */
  .glow {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,255,71,0.12) 0%, transparent 70%);
    top: -50px;
    right: -50px;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; }
  }

  /* Second glow */
  .glow2 {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(100,100,255,0.08) 0%, transparent 70%);
    bottom: -30px;
    left: -30px;
    animation: pulse 4s ease-in-out infinite reverse;
  }

  /* Stars/dots */
  .dots {
    position: absolute;
    inset: 0;
  }
  .dot {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(232,255,71,0.6);
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* Waveform bars */
  .waveform {
    position: absolute;
    bottom: 54px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 28px;
  }

  .bar {
    width: 3px;
    background: #E8FF47;
    border-radius: 2px;
    animation: wave var(--spd) ease-in-out infinite alternate;
    opacity: 0.7;
  }

  @keyframes wave {
    from { height: 4px; }
    to { height: var(--h); }
  }

  /* Content */
  .content {
    position: absolute;
    inset: 0;
    padding: 22px 20px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(232,255,71,0.12);
    border: 1px solid rgba(232,255,71,0.25);
    border-radius: 20px;
    padding: 3px 10px;
    width: fit-content;
  }

  .tag-dot {
    width: 6px;
    height: 6px;
    background: #E8FF47;
    border-radius: 50%;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .tag-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: #E8FF47;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .headline {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    line-height: 1.15;
    color: #ffffff;
    letter-spacing: -0.02em;
    margin-top: 12px;
  }

  .headline em {
    font-style: normal;
    color: #E8FF47;
  }

  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .url {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.02em;
  }

  .cta {
    background: #E8FF47;
    color: #07070B;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 11px;
    padding: 7px 14px;
    border-radius: 4px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    animation: ctaPulse 2s ease-in-out infinite;
  }

  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,255,71,0.4); }
    50% { box-shadow: 0 0 12px 3px rgba(232,255,71,0.2); }
  }

  .stars {
    display: flex;
    gap: 2px;
    margin-top: 6px;
  }

  .star {
    color: #E8FF47;
    font-size: 11px;
    animation: starPop var(--sd) ease-in-out infinite;
  }

  @keyframes starPop {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  .sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    color: rgba(255,255,255,0.55);
    margin-top: 4px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="dots">
    <div class="dot" style="top:15%;left:12%;--d:2.1s"></div>
    <div class="dot" style="top:25%;left:78%;--d:3.3s"></div>
    <div class="dot" style="top:60%;left:88%;--d:2.7s"></div>
    <div class="dot" style="top:80%;left:45%;--d:1.9s"></div>
    <div class="dot" style="top:40%;left:55%;--d:2.5s"></div>
  </div>

  <!-- Waveform -->
  <div class="waveform">
    <div class="bar" style="--h:8px;--spd:0.6s"></div>
    <div class="bar" style="--h:18px;--spd:0.8s"></div>
    <div class="bar" style="--h:24px;--spd:0.5s"></div>
    <div class="bar" style="--h:14px;--spd:0.9s"></div>
    <div class="bar" style="--h:22px;--spd:0.7s"></div>
    <div class="bar" style="--h:10px;--spd:1.0s"></div>
    <div class="bar" style="--h:20px;--spd:0.6s"></div>
    <div class="bar" style="--h:16px;--spd:0.8s"></div>
    <div class="bar" style="--h:26px;--spd:0.55s"></div>
    <div class="bar" style="--h:12px;--spd:0.75s"></div>
    <div class="bar" style="--h:20px;--spd:0.65s"></div>
    <div class="bar" style="--h:8px;--spd:0.9s"></div>
  </div>

  <div class="content">
    <div>
      <div class="tag">
        <div class="tag-dot"></div>
        <span class="tag-text">AI Music</span>
      </div>

      <div class="headline">
        Is your favorite<br>AI track <em>actually</em><br>good?
      </div>

      <div class="stars">
        <span class="star" style="--sd:1.2s">★</span>
        <span class="star" style="--sd:1.5s">★</span>
        <span class="star" style="--sd:1.8s">★</span>
        <span class="star" style="--sd:2.1s">★</span>
        <span class="star" style="--sd:2.4s">★</span>
      </div>

      <div class="sub">Rate blind. No bias.</div>
    </div>

    <div class="bottom">
      <span class="url">votemyai.com</span>
      <div class="cta">RATE NOW →</div>
    </div>
  </div>
</div>
</body>
</html>
