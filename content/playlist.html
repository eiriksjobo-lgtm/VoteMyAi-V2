<!-- ═══ PLAYLIST ═══ -->
<main class="playlist-wrap">
  <div class="playlist-header">
    <h1 id="playlistTitle">ALL <span class="accent">TRACKS</span></h1>
    <div class="playlist-meta">
      <span class="playlist-count" id="playlistCount">Loading...</span>
    </div>
  </div>

  <div class="genre-pills-wrap">
    <button class="genre-arrow left" id="genreArrowL" aria-label="Scroll left"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="genre-pills" id="genrePills"></div>
    <button class="genre-arrow right" id="genreArrowR" aria-label="Scroll right"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="subgenre-pills-wrap" id="subgenreWrap" style="display:none">
    <button class="sub-arrow left" id="subArrowL" aria-label="Scroll left"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="subgenre-pills" id="subgenrePills"></div>
    <button class="sub-arrow right" id="subArrowR" aria-label="Scroll right"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <div class="playlist-toolbar">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search tracks, genres, tools...">
      <button class="search-clear" id="searchClear" aria-label="Clear">&times;</button>
    </div>
    <div class="genre-sort-toggle">
      <button class="genre-sort-btn active" data-sort="top">Top Rated</button>
      <button class="genre-sort-btn" data-sort="newest">Newest</button>
      <button class="genre-sort-btn" data-sort="most">Most Rated</button>
    </div>
  </div>

  <div class="track-list" id="trackList"></div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
    <button class="load-more-btn" id="loadMoreBtn">Load More</button>
  </div>
</main>
