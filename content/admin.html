<div id="loginSection">
  <div class="admin-login-box">
    <h1>ADMIN</h1>
    <p>VoteMyAI dashboard &mdash; authorized access only</p>
    <input type="password" id="adminPasswordInput" placeholder="Password">
    <button class="admin-login-btn" id="adminLoginBtn">Login</button>
    <div class="status" id="loginStatus" style="margin-top:16px;"></div>
  </div>
</div>

<div id="adminPanel" style="display:none;">
  <div class="admin-header">
    <span class="admin-title">VOTEMYAI <span class="admin-badge">ADMIN</span></span>
    <a href="/">&larr; Back to site</a>
  </div>

  <div class="admin-container">
    <div class="status" id="adminStatus"></div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Tracks</div><div class="stat-value" id="sTracks">&mdash;</div></div>
      <div class="stat-card"><div class="stat-label">Ratings</div><div class="stat-value" id="sRatings">&mdash;</div></div>
      <div class="stat-card"><div class="stat-label">Comments</div><div class="stat-value" id="sComments">&mdash;</div></div>
      <div class="stat-card"><div class="stat-label">Users</div><div class="stat-value" id="sUsers">&mdash;</div></div>
      <div class="stat-card"><div class="stat-label">Messages</div><div class="stat-value" id="sMessages">&mdash;</div></div>
      <div class="stat-card"><div class="stat-label">Avg Rating</div><div class="stat-value" id="sAvg">&mdash;</div></div>
    </div>

    <div style="margin-bottom:16px;">
      <input type="text" id="adminSearch" class="admin-search" placeholder="Search users, tracks, comments, messages...">
    </div>

    <div class="tabs" id="adminTabs">
      <button class="tab active" data-tab="users">Users</button>
      <button class="tab" data-tab="tracks">Tracks</button>
      <button class="tab" data-tab="comments">Comments</button>
      <button class="tab" data-tab="messages">Messages</button>
    </div>

    <div class="tab-content active" id="tab-users"><div class="loading">Loading users...</div></div>
    <div class="tab-content" id="tab-tracks"><div class="loading">Loading tracks...</div></div>
    <div class="tab-content" id="tab-comments"><div class="loading">Loading comments...</div></div>
    <div class="tab-content" id="tab-messages"><div class="loading">Loading messages...</div></div>
  </div>
</div>
