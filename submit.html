<!DOCTYPE html>
<html lang="en">
<head>

  <title>Submit Your AI Music Track – VoteMyAI</title>
  
  <meta name="description" content="Submit your AI-generated music track to VoteMyAI. Share songs made with Suno, Udio or other AI tools via YouTube, SoundCloud or directly and let the community rate.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.votemyai.com/submit.html">
  <meta name="theme-color" content="#e8ff47">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #e8ff47;
      --text: #f0f0f0;
      --muted: #666680;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container { max-width: 600px; margin: 0 auto; }
    
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 32px;
      text-align: center;
    }
    
    .form-group { margin-bottom: 24px; }
    
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    
    .label-hint {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.8rem;
      opacity: 0.7;
    }
    
    input, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .url-help {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .url-help strong { color: var(--text); font-weight: 600; }

    /* Genre combobox */
    .genre-combo { position: relative; }
    .genre-combo input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      cursor: text;
    }
    .genre-combo input:focus { border-color: var(--accent); }
    .genre-combo input::placeholder { color: var(--muted); }
    .genre-dropdown {
      display: none;
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 100;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .genre-dropdown.open { display: block; }
    .genre-dropdown::-webkit-scrollbar { width: 6px; }
    .genre-dropdown::-webkit-scrollbar-track { background: transparent; }
    .genre-dropdown::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .genre-group-label {
      padding: 8px 16px 4px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      pointer-events: none;
      position: sticky;
      top: 0;
      background: var(--surface);
    }
    .genre-option {
      padding: 10px 16px 10px 24px;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }
    .genre-option:hover, .genre-option.highlighted { background: rgba(232,255,71,0.08); }
    .genre-option.hidden { display: none; }
    .genre-no-match {
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--muted);
      display: none;
    }
    .genre-custom-hint {
      padding: 8px 16px 12px;
      font-size: 0.75rem;
      color: var(--accent);
      opacity: 0.7;
      display: none;
      cursor: pointer;
    }
    .genre-custom-hint:hover { opacity: 1; }
    .genre-selected-tag {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 12px;
      background: rgba(232,255,71,0.1);
      border: 1px solid rgba(232,255,71,0.25);
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      width: fit-content;
    }
    .genre-selected-tag.show { display: inline-flex; }
    .genre-selected-tag .genre-clear {
      cursor: pointer;
      opacity: 0.6;
      font-size: 1rem;
      line-height: 1;
    }
    .genre-selected-tag .genre-clear:hover { opacity: 1; }
    
    /* Platform detection badge */
    .platform-badge {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .platform-badge.show { display: inline-flex; }
    .platform-badge.youtube { background: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.3); color: #ff4444; }
    .platform-badge.soundcloud { background: rgba(255,136,0,0.1); border: 1px solid rgba(255,136,0,0.3); color: #ff8800; }
    .platform-badge.invalid { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #f87171; }
    
    /* Preview */
    .preview-container {
      margin-top: 16px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      display: none;
    }
    .preview-container.show { display: block; }
    .preview-container iframe { width: 100%; border: none; }
    .preview-yt { height: 0; padding-bottom: 56.25%; position: relative; }
    .preview-yt iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    .submit-btn {
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
    }
    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back-link:hover { color: var(--text); }
    
    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 24px;
      text-align: center;
      display: none;
    }
    .success { background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3); color: #4ade80; }
    .error { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); color: #f87171; }
    
    .login-prompt {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
    }
    .login-prompt p { color: var(--muted); margin-bottom: 20px; font-size: 1rem; }
    .login-prompt .login-btn {
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .login-prompt .login-btn:hover { opacity: 0.9; }
    
    @media (max-width: 680px) {
      body { padding: 20px 12px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Submit Your Track</h1>
  
  <div id="message" class="message"></div>
  
  <div id="loginPrompt" class="login-prompt" style="display: none;">
    <p>You need to be logged in to submit a track.</p>
    <a href="/login.html?redirect=/submit.html" class="login-btn">Log In to Submit</a>
    <a href="/" class="back-link">&larr; Back to home</a>
  </div>
  
  <div id="formContainer" style="display: none;">
    <form id="submitForm">
      <div class="form-group">
        <label>Track URL <span class="label-hint">&mdash; Suno, Udio, YouTube or SoundCloud</span></label>
        <input type="url" id="trackUrl" placeholder="Paste your track link here..." required>
        <div class="url-help">Used a different AI tool? Just upload your track to <strong>YouTube</strong> or <strong>SoundCloud</strong> first, then paste the link here.</div>
        <div class="platform-badge" id="platformBadge"></div>
        <div class="preview-container" id="previewContainer"></div>
      </div>
      
      <div class="form-group">
        <label>Track Title</label>
        <input type="text" id="title" placeholder="My Awesome AI Track" required maxlength="100">
      </div>
      
      <div class="form-group">
        <label>AI Tool Used</label>
        <select id="tool" required>
          <option value="">Select tool...</option>
          <option value="Suno">Suno</option>
          <option value="Udio">Udio</option>
          <option value="ElevenLabs">ElevenLabs</option>
          <option value="Gemini">Gemini (Lyria)</option>
          <option value="Other">Other</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Genre <span class="label-hint">&mdash; search or pick from list</span></label>
        <input type="hidden" id="genre" required>
        <div class="genre-combo" id="genreCombo">
          <input type="text" id="genreInput" placeholder="Type to search genres..." autocomplete="off">
          <div class="genre-dropdown" id="genreDropdown"></div>
          <div class="genre-selected-tag" id="genreTag"><span id="genreTagText"></span><span class="genre-clear" id="genreClear">&times;</span></div>
        </div>
      </div>
      
      <button type="submit" class="submit-btn" id="submitBtn">Submit Track</button>
    </form>
    
    <a href="/" class="back-link">&larr; Back to home</a>
  </div>
</div>

<script type="module">
  const SUPABASE_URL = 'https://gezijezmsecbtzytotax.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_hOOMtCz7gYsu_-CVD6lW9Q_SxtFlNhw';
  
  let currentUser = null;
  let accessToken = null;
  let detectedPlatform = null;
  let detectedId = null;
  let detectedUrl = null;

  // ── Genre data ──
  const GENRES = {
    'Pop': ['Pop', 'Synth-Pop', 'Indie Pop', 'Electropop', 'Dream Pop', 'K-Pop', 'J-Pop', 'Art Pop', 'Dance Pop'],
    'Rock': ['Rock', 'Indie Rock', 'Alt Rock', 'Punk Rock', 'Post-Punk', 'Garage Rock', 'Psychedelic Rock', 'Prog Rock', 'Shoegaze', 'Grunge', 'Britpop'],
    'Hip-Hop & Rap': ['Hip-Hop', 'Trap', 'Boom Bap', 'Lo-Fi Hip-Hop', 'Drill', 'Conscious Rap', 'Old School Hip-Hop', 'Cloud Rap'],
    'Electronic': ['Electronic', 'House', 'Deep House', 'Tech House', 'Techno', 'Trance', 'Dubstep', 'Drum & Bass', 'IDM', 'Breakbeat', 'Garage', 'Hardstyle', 'Eurodance', 'Italo Disco', 'Synthwave', 'Electro', 'Future Bass'],
    'R&B & Soul': ['R&B / Soul', 'Neo Soul', 'Contemporary R&B', 'Motown', 'Funk', 'Disco'],
    'Dance & Club': ['Dance', 'EDM', 'Disco', 'Nu-Disco', 'Italo Disco', 'Tropical House', 'Afro House', 'Dancehall'],
    'Metal': ['Metal', 'Heavy Metal', 'Death Metal', 'Black Metal', 'Doom Metal', 'Thrash Metal', 'Metalcore', 'Nu Metal', 'Power Metal', 'Symphonic Metal'],
    'Jazz': ['Jazz', 'Smooth Jazz', 'Bebop', 'Jazz Fusion', 'Acid Jazz', 'Nu Jazz', 'Swing'],
    'Classical & Orchestral': ['Classical', 'Orchestral', 'Cinematic', 'Neoclassical', 'Baroque', 'Romantic', 'Chamber Music', 'Film Score', 'Epic Orchestral'],
    'Indie & Folk': ['Indie / Folk', 'Folk', 'Acoustic', 'Singer-Songwriter', 'Indie Folk', 'Americana', 'Bluegrass', 'Celtic'],
    'Latin': ['Latin', 'Reggaeton', 'Salsa', 'Bossa Nova', 'Latin Pop', 'Cumbia', 'Bachata', 'Merengue'],
    'Country & Americana': ['Country', 'Country Rock', 'Americana', 'Outlaw Country', 'Alt Country', 'Bluegrass', 'Honky Tonk'],
    'Chill & Ambient': ['Ambient', 'Lo-Fi', 'Chillout', 'Chillwave', 'Downtempo', 'New Age', 'Space Ambient', 'Vaporwave'],
    'Reggae & Caribbean': ['Reggae', 'Dub', 'Dancehall', 'Ska', 'Rocksteady', 'Soca', 'Calypso'],
    'African': ['Afrobeat', 'Afrobeats', 'Afro House', 'Amapiano', 'Highlife', 'Juju'],
    'Blues': ['Blues', 'Delta Blues', 'Chicago Blues', 'Blues Rock', 'Rhythm & Blues'],
    'World & Other': ['World Music', 'Middle Eastern', 'Indian', 'Asian', 'Flamenco', 'Polka', 'Experimental', 'Noise', 'Other']
  };

  // Build genre dropdown
  function buildGenreDropdown() {
    const dropdown = document.getElementById('genreDropdown');
    let html = '';
    for (const [group, genres] of Object.entries(GENRES)) {
      html += `<div class="genre-group-label">${group}</div>`;
      for (const g of genres) {
        html += `<div class="genre-option" data-value="${g}">${g}</div>`;
      }
    }
    html += '<div class="genre-no-match" id="genreNoMatch">No matching genre found</div>';
    html += '<div class="genre-custom-hint" id="genreCustomHint">Press Enter to use "<span id="genreCustomValue"></span>"</div>';
    dropdown.innerHTML = html;
  }

  // Genre combobox logic
  function initGenreCombo() {
    buildGenreDropdown();
    const input = document.getElementById('genreInput');
    const dropdown = document.getElementById('genreDropdown');
    const hiddenInput = document.getElementById('genre');
    const tag = document.getElementById('genreTag');
    const tagText = document.getElementById('genreTagText');
    const clearBtn = document.getElementById('genreClear');
    const noMatch = document.getElementById('genreNoMatch');
    const customHint = document.getElementById('genreCustomHint');
    const customValue = document.getElementById('genreCustomValue');
    let highlightIdx = -1;

    function selectGenre(value) {
      hiddenInput.value = value;
      tagText.textContent = value;
      tag.classList.add('show');
      input.value = '';
      input.style.display = 'none';
      dropdown.classList.remove('open');
    }

    function clearGenre() {
      hiddenInput.value = '';
      tag.classList.remove('show');
      input.style.display = '';
      input.value = '';
      input.focus();
    }

    clearBtn.addEventListener('click', clearGenre);

    input.addEventListener('focus', () => {
      dropdown.classList.add('open');
      filterGenres('');
    });

    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      filterGenres(q);
      dropdown.classList.add('open');
    });

    input.addEventListener('keydown', (e) => {
      const visible = [...dropdown.querySelectorAll('.genre-option:not(.hidden)')];
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        highlightIdx = Math.min(highlightIdx + 1, visible.length - 1);
        updateHighlight(visible);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        highlightIdx = Math.max(highlightIdx - 1, 0);
        updateHighlight(visible);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (highlightIdx >= 0 && visible[highlightIdx]) {
          selectGenre(visible[highlightIdx].dataset.value);
        } else if (input.value.trim()) {
          selectGenre(input.value.trim());
        }
      } else if (e.key === 'Escape') {
        dropdown.classList.remove('open');
      }
    });

    function updateHighlight(visible) {
      dropdown.querySelectorAll('.genre-option').forEach(o => o.classList.remove('highlighted'));
      if (visible[highlightIdx]) {
        visible[highlightIdx].classList.add('highlighted');
        visible[highlightIdx].scrollIntoView({ block: 'nearest' });
      }
    }

    function filterGenres(q) {
      highlightIdx = -1;
      let anyVisible = false;
      dropdown.querySelectorAll('.genre-option').forEach(opt => {
        const match = !q || opt.dataset.value.toLowerCase().includes(q);
        opt.classList.toggle('hidden', !match);
        if (match) anyVisible = true;
      });
      // Show/hide group labels based on whether they have visible children
      dropdown.querySelectorAll('.genre-group-label').forEach(label => {
        let next = label.nextElementSibling;
        let hasVisible = false;
        while (next && !next.classList.contains('genre-group-label')) {
          if (next.classList.contains('genre-option') && !next.classList.contains('hidden')) hasVisible = true;
          next = next.nextElementSibling;
        }
        label.style.display = hasVisible ? '' : 'none';
      });
      if (!anyVisible && q) {
        noMatch.style.display = 'block';
        customHint.style.display = 'block';
        customValue.textContent = input.value.trim();
      } else {
        noMatch.style.display = 'none';
        customHint.style.display = 'none';
      }
    }

    dropdown.addEventListener('click', (e) => {
      const opt = e.target.closest('.genre-option');
      if (opt) selectGenre(opt.dataset.value);
      if (e.target.closest('.genre-custom-hint')) {
        selectGenre(input.value.trim());
      }
    });

    // Close on click outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.genre-combo')) {
        dropdown.classList.remove('open');
      }
    });
  }
  
  // ── Auth ──
  async function initAuth() {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const hashToken = params.get('access_token');
    
    if (hashToken) {
      accessToken = hashToken;
      localStorage.setItem('sb_token', accessToken);
      window.history.replaceState(null, '', window.location.pathname);
    } else {
      accessToken = localStorage.getItem('sb_token');
    }
    
    if (accessToken) {
      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          headers: { 'Authorization': `Bearer ${accessToken}`, 'apikey': SUPABASE_KEY }
        });
        if (res.ok) {
          currentUser = await res.json();
        } else {
          accessToken = null;
          localStorage.removeItem('sb_token');
        }
      } catch (e) {
        accessToken = null;
        localStorage.removeItem('sb_token');
      }
    }
    
    if (currentUser) {
      document.getElementById('formContainer').style.display = 'block';
      document.getElementById('loginPrompt').style.display = 'none';
    } else {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('loginPrompt').style.display = 'block';
    }
  }
  
  // ── Platform detection ──
  function parseTrackUrl(url) {
    const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([^&\?\/\s]+)/);
    if (ytMatch) return { platform: 'youtube', id: ytMatch[1], url: url };
    
    if (url.includes('soundcloud.com/') && url.split('/').length >= 4) {
      return { platform: 'soundcloud', id: url.split('?')[0], url: url };
    }
    
    const sunoLong = url.match(/suno\.com\/song\/([a-f0-9-]{36})/);
    if (sunoLong) return { platform: 'suno', id: sunoLong[1], url: url };
    const sunoShort = url.match(/suno\.com\/s\/([a-zA-Z0-9_-]+)/);
    if (sunoShort) return { platform: 'suno-short', id: sunoShort[1], url: url };
    
    if (url.includes('udio.com/songs/')) {
      const udioSlug = url.match(/udio\.com\/songs\/([a-zA-Z0-9_-]+)/);
      if (udioSlug) return { platform: 'udio-resolve', id: udioSlug[1], url: url };
    }
    
    return null;
  }
  
  function showPreview(platform, id) {
    const container = document.getElementById('previewContainer');
    
    if (platform === 'youtube') {
      container.innerHTML = `<div class="preview-yt"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}" allowfullscreen loading="lazy"></iframe></div>`;
    } else if (platform === 'soundcloud') {
      container.innerHTML = `<iframe height="166" scrolling="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(id)}&color=%23e8ff47&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false" loading="lazy"></iframe>`;
    } else if (platform === 'suno') {
      container.innerHTML = `<iframe height="200" src="https://suno.com/embed/${encodeURIComponent(id)}" loading="lazy" style="border:none;width:100%;border-radius:8px;"></iframe>`;
    } else if (platform === 'udio') {
      container.innerHTML = `<iframe height="200" src="https://www.udio.com/embed/${encodeURIComponent(id)}" scrolling="no" loading="lazy" style="border:none;width:100%;border-radius:8px;"></iframe>`;
    }
    
    container.classList.add('show');
  }
  
  // Live URL detection
  let debounceTimer;
  document.getElementById('trackUrl').addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(async () => {
      const url = e.target.value.trim();
      const badge = document.getElementById('platformBadge');
      const preview = document.getElementById('previewContainer');
      
      if (!url) {
        badge.className = 'platform-badge';
        preview.classList.remove('show');
        detectedPlatform = null;
        detectedId = null;
        return;
      }
      
      const result = parseTrackUrl(url);
      
      if (result) {
        if (result.platform === 'suno-short') {
          badge.textContent = '\u266a Resolving Suno link...';
          badge.className = 'platform-badge show suno';
          preview.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:0.85rem;">Resolving Suno link...</div>`;
          preview.classList.add('show');
          
          try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/resolve-suno`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
              body: JSON.stringify({ url: result.url })
            });
            const data = await res.json();
            
            if (data.uuid) {
              detectedPlatform = 'suno';
              detectedId = data.uuid;
              detectedUrl = `https://suno.com/song/${data.uuid}`;
              badge.textContent = '\u266a Suno detected';
              badge.className = 'platform-badge show suno';
              showPreview('suno', data.uuid);
            } else {
              detectedPlatform = null;
              detectedId = null;
              detectedUrl = null;
              badge.textContent = '\u2717 Could not resolve Suno link';
              badge.className = 'platform-badge show invalid';
              preview.classList.remove('show');
            }
          } catch (err) {
            detectedPlatform = null;
            detectedId = null;
            detectedUrl = null;
            badge.textContent = '\u2717 Could not resolve Suno link';
            badge.className = 'platform-badge show invalid';
            preview.classList.remove('show');
          }
          return;
        }

        if (result.platform === 'udio-resolve') {
          badge.textContent = '\u266a Resolving Udio link...';
          badge.className = 'platform-badge show udio';
          preview.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:0.85rem;">Resolving Udio link...</div>`;
          preview.classList.add('show');
          
          try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/resolve-suno`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
              body: JSON.stringify({ url: result.url })
            });
            const data = await res.json();
            
            if (data.uuid) {
              detectedPlatform = 'udio';
              detectedId = data.uuid;
              detectedUrl = `https://www.udio.com/songs/${result.id}`;
              badge.textContent = '\u266a Udio detected';
              badge.className = 'platform-badge show udio';
              showPreview('udio', data.uuid);
            } else {
              detectedPlatform = 'udio';
              detectedId = result.id;
              detectedUrl = result.url;
              badge.textContent = '\u266a Udio detected';
              badge.className = 'platform-badge show udio';
              showPreview('udio', result.id);
            }
          } catch (err) {
            detectedPlatform = 'udio';
            detectedId = result.id;
            detectedUrl = result.url;
            badge.textContent = '\u266a Udio detected';
            badge.className = 'platform-badge show udio';
            showPreview('udio', result.id);
          }
          return;
        }
        
        detectedPlatform = result.platform;
        detectedId = result.id;
        detectedUrl = result.url;
        
        const labels = {
          youtube: '\u25b6 YouTube',
          soundcloud: '\u2601 SoundCloud',
          suno: '\u266a Suno',
          udio: '\u266a Udio'
        };
        badge.textContent = labels[result.platform] + ' detected';
        badge.className = `platform-badge show ${result.platform}`;
        showPreview(result.platform, result.id);
      } else {
        detectedPlatform = null;
        detectedId = null;
        detectedUrl = null;
        badge.textContent = '\u2717 Unsupported URL \u2014 use YouTube, SoundCloud, Suno or Udio';
        badge.className = 'platform-badge show invalid';
        preview.classList.remove('show');
      }
    }, 400);
  });
  
  // ── Helpers ──
  function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.className = `message ${type}`;
    msg.textContent = text;
    msg.style.display = 'block';
  }
  
  // ── Form submit ──
  document.getElementById('submitForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    
    const title = document.getElementById('title').value.trim();
    const tool = document.getElementById('tool').value;
    const genre = document.getElementById('genre').value;
    
    if (!genre) {
      showMessage('Please select a genre', 'error');
      btn.disabled = false;
      btn.textContent = 'Submit Track';
      return;
    }

    if (!detectedPlatform || !detectedId) {
      showMessage('Please enter a valid URL from YouTube, SoundCloud, Suno or Udio', 'error');
      btn.disabled = false;
      btn.textContent = 'Submit Track';
      return;
    }
    
    try {
      let thumbnailUrl = null;
      try {
        btn.textContent = 'Fetching cover art...';
        const thumbRes = await fetch(`${SUPABASE_URL}/functions/v1/fetch-thumbnail`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
          body: JSON.stringify({ url: detectedUrl || `https://www.youtube.com/watch?v=${detectedId}` })
        });
        const thumbData = await thumbRes.json();
        if (thumbData.thumbnail_url) thumbnailUrl = thumbData.thumbnail_url;
      } catch (e) {
        console.warn('Thumbnail fetch failed, continuing without:', e);
      }

      btn.textContent = 'Submitting...';

      const trackData = {
        title,
        yt_id: detectedPlatform === 'youtube' ? detectedId : null,
        embed_url: detectedUrl || null,
        thumbnail_url: thumbnailUrl,
        tool,
        genre,
        votes: 0,
        user_id: currentUser.id
      };
      
      const res = await fetch(`${SUPABASE_URL}/rest/v1/tracks`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(trackData)
      });
      
      if (res.ok) {
        showMessage('\u2705 Track submitted successfully!', 'success');
        gtag('event', 'track_submit', { tool: trackData.tool, genre: trackData.genre, platform: detectedPlatform });
        document.getElementById('submitForm').reset();
        document.getElementById('platformBadge').className = 'platform-badge';
        document.getElementById('previewContainer').classList.remove('show');
        document.getElementById('genreTag').classList.remove('show');
        document.getElementById('genreInput').style.display = '';
        document.getElementById('genre').value = '';
        detectedPlatform = null;
        detectedId = null;
        detectedUrl = null;
        setTimeout(() => window.location.href = '/', 2000);
      } else {
        const err = await res.text();
        console.error('Submit error:', err);
        showMessage('Failed to submit track. Please try again.', 'error');
      }
    } catch (err) {
      console.error('Network error:', err);
      showMessage('Network error. Please try again.', 'error');
    }
    
    btn.disabled = false;
    btn.textContent = 'Submit Track';
  });
  
  initGenreCombo();
  initAuth();
</script>
