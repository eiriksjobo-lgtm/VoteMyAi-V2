<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – VoteMyAI</title>
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.votemyai.com/contact.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e; --accent: #e8ff47; --text: #f0f0f0; --muted: #666680; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; line-height: 1.8; }
    nav { position: sticky; top: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 2px; color: var(--accent); cursor: pointer; text-decoration: none; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.78rem; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-submit { background: var(--accent); color: #0a0a0f; padding: 8px 18px; border-radius: 8px; font-weight: 700; font-size: 0.78rem; letter-spacing: 1.5px; text-transform: uppercase; text-decoration: none; transition: opacity 0.2s; }
    .nav-submit:hover { opacity: 0.9; color: #0a0a0f; }
    .container { max-width: 600px; margin: 0 auto; padding: 80px 40px; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 2px; color: var(--accent); margin-bottom: 20px; }
    p { color: var(--muted); margin-bottom: 32px; }
    .contact-info { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
    .contact-item { margin-bottom: 24px; }
    .contact-item:last-child { margin-bottom: 0; }
    .contact-label { font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .contact-value { color: var(--text); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; color: var(--accent); margin-bottom: 8px; font-size: 0.9rem; }
    input, textarea { width: 100%; background: rgba(30,30,46,0.5); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 1rem; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .submit-btn { background: var(--accent); color: #0a0a0f; border: none; padding: 14px 32px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .submit-btn:hover { opacity: 0.9; }
    @media (max-width: 640px) {
      .container { padding: 40px 16px; }
      h1 { font-size: 2.2rem; }
      nav { padding: 0 16px; }
      .nav-links { gap: 8px; }
      .nav-links a { font-size: 0.66rem; letter-spacing: 0.8px; }
      .nav-submit { padding: 6px 12px; font-size: 0.66rem; }
      .contact-info { padding: 20px 16px; }
      input, textarea { font-size: 16px; }
    }
  </style>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<nav>
  <a href="/" class="logo">VOTEMYAI</a>
  <div class="nav-links">
    <a href="/blog.html">News</a>
    <a href="/radio.html">Radio</a>
    <a href="/login.html">Login</a>
    <a href="/submit.html" class="nav-submit">Submit</a>
  </div>
</nav>

<div class="container">
  <h1>Contact Us</h1>
  <p>Have questions, feedback, or need support? Send us a message!</p>

  <div class="contact-info">
    <form id="contactForm">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="message" rows="6" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Send Message</button>
      <div id="status"></div>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gezijezmsecbtzytotax.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hOOMtCz7gYsu_-CVD6lW9Q_SxtFlNhw';

document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const status = document.getElementById('status');
  
  btn.disabled = true;
  btn.textContent = 'Sending...';
  
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/contact_messages`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      })
    });
    
    if (res.ok) {
      status.innerHTML = '<p style="color: #4ade80; margin-top: 16px;">✅ Message sent successfully!</p>';
      e.target.reset();
    } else {
      status.innerHTML = '<p style="color: #f87171; margin-top: 16px;">❌ Failed to send. Please try again.</p>';
    }
  } catch (err) {
    status.innerHTML = '<p style="color: #f87171; margin-top: 16px;">❌ Network error. Please try again.</p>';
  }
  
  btn.disabled = false;
  btn.textContent = 'Send Message';
});
</script>


<!-- Back to Top -->
<button id="backToTop" aria-label="Back to top" style="position:fixed;bottom:32px;right:32px;z-index:9999;width:44px;height:44px;border:2px solid #e8ff47;background:#07070b;color:#e8ff47;font-size:1.3rem;cursor:pointer;display:none;align-items:center;justify-content:center;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:opacity .3s,transform .3s;" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#8679;</button>
<script>
(function(){var b=document.getElementById('backToTop');window.addEventListener('scroll',function(){if(window.scrollY>300){b.style.display='flex'}else{b.style.display='none'}});})();
</script>
</body>
</html>
