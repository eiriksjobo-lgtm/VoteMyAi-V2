<!-- ═══ SPA CONTENT (swapped on navigation) ═══ -->
<div id="spa-content">
  <!-- Content fragments are loaded here by the router -->
  <div style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
    <div style="text-align:center;">
      <div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
      <div style="color:var(--muted);font-size:0.82rem;">Loading...</div>
    </div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>

<!-- ═══ PERSISTENT: Page Frame (iOS navigation overlay) ═══ -->
<div class="page-frame" id="pageFrame">
  <button class="pf-close" id="pfClose" title="Back to browse" aria-label="Back to browse">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
  <div class="pf-iframe-wrap"><iframe></iframe></div>
</div>

<!-- ═══ PERSISTENT: Hidden media container (iframes survive navigation here) ═══ -->
<div id="persistent-media" style="position:fixed;left:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:0.01;pointer-events:none;z-index:-1;"></div>

<!-- ═══ PERSISTENT: Player Bar ═══ -->
<div class="player-bar" id="playerBar">
  <div class="player-eq"><span></span><span></span><span></span><span></span></div>
  <div class="player-info" id="playerInfo" title="Click to find this track" style="cursor:pointer;">
    <div class="player-title" id="playerTitle"></div>
    <div class="player-meta" id="playerMeta"></div>
  </div>
  <div class="player-controls">
    <button class="player-ctrl locate" id="btnLocate" title="Find this track" aria-label="Find this track">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </button>
    <button class="player-ctrl cl" id="btnClose" title="Close player" aria-label="Close player">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
</div>

<!-- ═══ PERSISTENT: Share Modal ═══ -->
<div class="share-overlay" id="shareOverlay">
  <div class="share-modal" style="position:relative;">
    <button class="share-modal-close" id="shareClose">&times;</button>
    <div class="share-modal-title" id="shareModalTitle">Share Track</div>
    <div class="share-modal-sub">Share this track with friends</div>
    <div class="share-grid" id="shareGrid"></div>
    <div class="share-link-row">
      <input class="share-link-input" id="shareLinkInput" readonly>
      <button class="share-link-copy" id="shareLinkCopy">Copy</button>
    </div>
  </div>
</div>

<!-- ═══ PERSISTENT: Cookie Consent ═══ -->
<div id="cookieBanner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 24px;z-index:9999;font-size:0.82rem;color:var(--muted);">
  <div style="max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
    <span>We use cookies for analytics and to improve your experience. <a href="/privacy.html" style="color:var(--accent);">Privacy Policy</a></span>
    <div style="display:flex;gap:8px;flex-shrink:0;">
      <button onclick="VMA.acceptCookies()" style="background:var(--accent);color:var(--bg);border:none;padding:8px 20px;border-radius:6px;font-weight:700;font-size:0.78rem;cursor:pointer;font-family:'DM Sans',sans-serif;">Accept</button>
      <button onclick="VMA.declineCookies()" style="background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px 16px;border-radius:6px;font-weight:600;font-size:0.78rem;cursor:pointer;font-family:'DM Sans',sans-serif;">Decline</button>
    </div>
  </div>
</div>

<!-- ═══ JAVASCRIPT — loaded once, never reloaded ═══ -->
<script src="/js/app.js"></script>
<script src="/js/player.js"></script>
<script src="/js/router.js"></script>
<script>
  // Boot sequence: auth → load tracks → init player → init router
  (async function boot() {
    // Init shared systems
    VMA.initShareModal();
    VMAPlayer.init();

    // Auth check (non-blocking for page load)
    VMA.checkAuth().then(() => VMA.loadTracks());

    // Start router — loads initial page content
    VMARouter.init();
  })();
</script>
